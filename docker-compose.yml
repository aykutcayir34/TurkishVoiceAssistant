# Sohbet — Türkçe Sesli Asistan
#
# Profiller:
#   cpu (varsayılan): qdrant + app (hafif/mock backend'ler ile geliştirme)
#     docker compose --profile cpu up
#   gpu: ek olarak vLLM (Türkçe LLM). app gerçek backend'lere yönlendirilir.
#     docker compose --profile gpu up

services:
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["cpu", "gpu"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build:
      context: .
      args:
        EXTRAS: ${APP_EXTRAS:-}
    profiles: ["cpu", "gpu"]
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - qdrant
    environment:
      SOHBET_QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data

  # Gerçek Türkçe LLM'i vLLM ile OpenAI-uyumlu olarak sunar (GPU gerekir).
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: >
      --model ${SOHBET_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --served-model-name ${SOHBET_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qdrant_data:
