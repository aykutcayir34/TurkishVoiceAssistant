[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sohbet"
version = "0.1.0"
description = "Türkçe sesli asistan — açık kaynak modeller + vektör veritabanı ile full-duplex, barge-in destekli diyalog"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TurkishVoiceAssistant" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
vad = ["torch>=2.2", "silero-vad>=5.1"]
embedding = ["sentence-transformers>=2.7", "FlagEmbedding>=1.2"]
vectordb = ["qdrant-client>=1.9"]
tts = ["TTS>=0.22", "piper-tts>=1.2"]
llm = ["openai>=1.30"]
rag = ["pypdf>=4.2", "markdown-it-py>=3.0", "beautifulsoup4>=4.12", "tiktoken>=0.7"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
all = [
    "faster-whisper>=1.0",
    "torch>=2.2", "silero-vad>=5.1",
    "sentence-transformers>=2.7", "FlagEmbedding>=1.2",
    "qdrant-client>=1.9",
    "TTS>=0.22", "piper-tts>=1.2",
    "openai>=1.30",
    "pypdf>=4.2", "markdown-it-py>=3.0", "beautifulsoup4>=4.12", "tiktoken>=0.7",
]

[project.scripts]
sohbet = "sohbet.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sohbet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: gerçek/ağır model backend gerektiren testler (CI'da atlanır)",
    "slow: yavaş çalışan testler",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
